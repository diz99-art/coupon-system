worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 30000;
}

http {
    # 어느 서버(upstream)가 요청을 처리했는지 남긴다.
    log_format upstream '$time_local "$request" $status upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/upstream.log upstream;

    # 서버 2대에 번갈아(라운드 로빈) 보낸다.
    upstream coupon_two {
        server app1:8080;
        server app2:8080;
        keepalive 1024;
    }

    # 비교용: 같은 nginx를 거치되 서버 1대에만 보낸다.
    upstream coupon_one {
        server app1:8080;
        keepalive 1024;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_read_timeout 120s;

    server {
        listen 80;
        location / { proxy_pass http://coupon_two; }
    }

    server {
        listen 81;
        location / { proxy_pass http://coupon_one; }
    }
}
