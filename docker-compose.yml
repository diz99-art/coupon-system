# 로컬 개발용 MySQL, Redis, Kafka. 비밀번호는 내 컴퓨터에서만 쓰는 개발용 값이다.
# 서버 2대, nginx, Prometheus, Grafana는 cluster 프로필로 따로 켠다: docker compose --profile cluster up -d --build
services:
  mysql:
    image: mysql:8.4
    container_name: coupon-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coupon
      MYSQL_USER: coupon
      MYSQL_PASSWORD: coupon
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: coupon-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # KRaft 모드: Zookeeper 없이 Kafka가 스스로 메타데이터를 관리한다. 노드 하나가 브로커와 컨트롤러를 겸한다.
  kafka:
    image: apache/kafka:4.3.1
    container_name: coupon-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 접속 주소가 두 개다. 내 컴퓨터(bootRun, 테스트)는 localhost:9092, 같은 compose 안의 컨테이너는 kafka:29092.
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 브로커가 한 대뿐이라 내부 토픽 복제본도 1개로 둔다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # 앱 서버 2대. 같은 이미지를 쓰고, bench 프로필로 비교 API를 켠다.
  # 서버마다 CPU 1개, 메모리 1GB로 제한해서 "서버 1대 몫"을 일정하게 맞춘다.
  app1:
    profiles: ["cluster"]
    build: .
    image: coupon-app:latest
    container_name: coupon-app1
    hostname: app1
    environment:
      SPRING_PROFILES_ACTIVE: docker,bench
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    cpus: 1.0
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  app2:
    profiles: ["cluster"]
    image: coupon-app:latest
    container_name: coupon-app2
    hostname: app2
    environment:
      SPRING_PROFILES_ACTIVE: docker,bench
    # app1이 테이블을 다 만든 뒤에 켜서 두 서버가 동시에 테이블을 만들다 부딪치지 않게 한다.
    depends_on:
      app1: { condition: service_healthy }
    cpus: 1.0
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # 로드밸런서. 8090은 서버 2대로, 8091은 서버 1대(app1)로 보낸다.
  nginx:
    profiles: ["cluster"]
    image: nginx:1.29-alpine
    container_name: coupon-nginx
    ports:
      - "8090:80"
      - "8091:81"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    # 서버 쪽으로 연결을 수만 개 여닫는다. 출발 포트 범위를 넓히고, 닫힌 연결(TIME_WAIT)의 포트를 다시 쓰게 한다.
    # 없으면 서버 1대 구성에서 같은 주소로 가는 포트가 바닥나 502가 난다 (Address not available).
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
      net.ipv4.tcp_tw_reuse: 1
    depends_on:
      app1: { condition: service_healthy }
      app2: { condition: service_healthy }

  # 모니터링. Prometheus가 앱 2대의 /actuator/prometheus를 주기적으로 가져가 저장하고, Grafana가 그래프로 보여준다.
  prometheus:
    profiles: ["cluster"]
    image: prom/prometheus:v3.15.0
    container_name: coupon-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # http://localhost:3000 (로그인 없이 보기, 편집은 admin/admin). 데이터 소스와 대시보드는 파일에서 자동으로 불러온다.
  grafana:
    profiles: ["cluster"]
    image: grafana/grafana:13.2.2
    container_name: coupon-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/coupon.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  mysql-data:
