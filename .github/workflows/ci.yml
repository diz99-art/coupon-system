# push와 PR마다 전체 테스트를 돌린다.
# 테스트는 실제 MySQL, Redis, Kafka를 쓰므로 로컬과 같은 docker-compose.yml로 띄운다.
# main에 push되고 테스트가 통과하면 ARM64 이미지를 만들어 GHCR(ghcr.io)에 올린다 (k3s 클러스터 노드가 ARM64).
# 이어서 platform-infra의 이미지 태그를 이 커밋 해시로 바꿔 push한다 → ArgoCD가 감지해 클러스터에 배포한다 (GitOps).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Gradle 의존성과 빌드 결과를 캐시한다.
      - uses: gradle/actions/setup-gradle@v6

      # CI에서만 쓰는 일회용 컨테이너라 예시 값을 그대로 쓴다.
      - name: .env 만들기
        run: cp .env.example .env

      - name: MySQL, Redis, Kafka 실행
        run: docker compose up -d --wait mysql redis kafka

      - name: 테스트
        run: ./gradlew test

      - name: 실패하면 테스트 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test

      - name: 실패하면 컨테이너 로그 보기
        if: failure()
        run: docker compose logs --tail 200

  # 테스트를 통과한 main만 이미지로 만든다. PR이나 다른 브랜치는 테스트만 한다.
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # ARM64 러너에서 바로 빌드한다 (public 저장소 무료). x86 러너에서 QEMU로 흉내 내면 몇 배 느리다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # GHCR에 올리기
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN은 이 실행 동안만 유효한 임시 토큰이다. 따로 비밀번호를 저장할 필요가 없다.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 태그는 커밋 해시 하나만 붙인다 (latest를 쓰지 않는 이유는 platform-infra의 docs/coupon.md).
      # 이미지 라벨(org.opencontainers.image.source 등)로 어느 저장소·커밋에서 만들었는지 남긴다.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=${{ github.sha }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 빌드 층을 GitHub Actions 캐시에 저장 → 의존성이 그대로면 Gradle 다운로드 층을 다시 쓰지 않는다
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 올린 이미지
        run: |
          echo "### 이미지" >> "$GITHUB_STEP_SUMMARY"
          echo '`ghcr.io/${{ github.repository }}:${{ github.sha }}`' >> "$GITHUB_STEP_SUMMARY"

  # platform-infra의 k8s/apps/coupon/kustomization.yaml에서 이미지 태그(newTag) 한 줄만 바꿔 push한다.
  # 클러스터에 직접 배포하지 않는다: Git이 기준이고, ArgoCD가 Git을 보고 배포한다.
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 커밋이 연달아 오면 차례로 처리한다 (동시에 push하면 한쪽이 거절된다)
    concurrency:
      group: platform-infra-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # deploy key: platform-infra 저장소 하나에만 쓰기 권한이 있는 SSH 키. 개인키는 이 저장소의 Actions Secret에 있다
      - uses: actions/checkout@v7
        with:
          repository: diz99-art/platform-infra
          ssh-key: ${{ secrets.PLATFORM_INFRA_DEPLOY_KEY }}
          path: platform-infra

      - name: 이미지 태그를 이 커밋 해시로
        working-directory: platform-infra
        env:
          SHA: ${{ github.sha }}
          FILE: k8s/apps/coupon/kustomization.yaml
        run: |
          sed -i -E "s/^(    newTag: ).*/\1${SHA}/" "$FILE"
          grep -q "newTag: ${SHA}" "$FILE" || { echo "태그를 바꾸지 못했습니다"; exit 1; }
          git diff --stat

      - name: platform-infra에 push
        working-directory: platform-infra
        env:
          SHA: ${{ github.sha }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          if git diff --quiet; then echo "이미 같은 태그입니다. 할 일 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "coupon: 이미지 ${SHA::7} 배포" -m "coupon-system ${SHA}" -m "${SUBJECT%%$'\n'*}"
          # 그 사이 다른 커밋이 들어왔으면 위에 다시 얹어서 push (최대 3번)
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1

      - name: 배포 요청 기록
        run: |
          echo "### 배포 요청" >> "$GITHUB_STEP_SUMMARY"
          echo "platform-infra 이미지 태그 → \`${{ github.sha }}\` (ArgoCD가 1분 안에 감지)" >> "$GITHUB_STEP_SUMMARY"
