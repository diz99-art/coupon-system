# 테스트 전용 설정. classpath의 config/application.yml은 기본 application.yml보다 우선한다.
spring:
  profiles:
    active: test
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false

coupon:
  kafka:
    # 개발 서버가 읽는 coupon-issue 토픽에 테스트 메시지가 섞이지 않게 한다.
    topic: coupon-issue-test
    dead-letter-topic: coupon-issue-test.DLT
    # 테스트끼리 간섭하지 않도록 Kafka 리스너와 대사 스케줄러를 기본으로 꺼 두고, 필요한 테스트에서만 켠다.
    listener-auto-startup: false
  reconcile:
    scheduled: false
