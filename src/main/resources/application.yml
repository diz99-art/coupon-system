spring:
  application:
    name: coupon
  profiles:
    # 프로필을 정하지 않고 실행하면 개발 환경(local)으로 뜬다. 테스트는 test 프로필을 쓴다.
    default: local

  config:
    # 접속 정보와 비밀번호는 환경변수로 받는다. 내 컴퓨터에서는 프로젝트 폴더의 .env 파일을 읽는다 (없으면 건너뜀).
    # .env는 git에 올리지 않는다. 처음에는 cp .env.example .env
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:coupon}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # 운영 기준값: 스키마를 건드리지 않는다. 개발·테스트 프로필에서 create로 바꾼다.
    hibernate:
      ddl-auto: none
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # 브로커가 저장을 마쳤다고 답해야 전송 성공으로 본다.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 읽을 수 없는 메시지가 와도 컨슈머가 멈추지 않도록 감싼다.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.coupon.coupon.messaging

# 모니터링: /actuator/prometheus로 지표를 내보낸다. (docker 프로필에서는 관리용 포트 8081로 분리)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: coupon
    distribution:
      # 응답 시간을 구간별 개수로도 내보내서, Grafana에서 서버 여러 대를 합친 p95를 계산할 수 있게 한다.
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

coupon:
  # 인증: 인증 서버가 RS256으로 서명한 액세스 토큰을 공개키로 검증한다 (config/SecurityConfig)
  auth:
    # 공개키 목록(JWKS) 주소. 처음 토큰을 검증할 때 받아 5분 캐시하고, 모르는 키 id(kid)가 오면 다시 받는다
    jwk-set-uri: ${COUPON_AUTH_JWK_SET_URI:http://localhost:8080/auth/.well-known/jwks.json}
    issuer: platform-auth
    audience: platform
  kafka:
    topic: coupon-issue
    dead-letter-topic: coupon-issue.DLT
    group-id: coupon-issue-saver
    # 토픽을 만들 때 쓴다. 브로커가 1대인 개발 환경은 복제본 1개, 운영(prod)은 3개.
    partitions: 3
    replicas: 1
    retry:
      # DB 저장 실패 시 1초 간격으로 3번 더 시도하고, 그래도 실패하면 DLT로 보낸다.
      interval-ms: 1000
      max-retries: 3
  cache:
    # 없는 쿠폰 id를 이 시간 동안 "없음"으로 기억해서 같은 id의 요청이 DB를 반복해서 읽지 않게 한다 (캐시 관통 방지).
    not-found-ttl: 10s
  reconcile:
    # Redis와 DB를 비교해 보정하는 시각: 매분 0초 (초 분 시 일 월 요일)
    cron: "0 * * * * *"
    # 분산 락(ShedLock) 유지 시간. 이유는 ReconciliationScheduler 주석과 README 7단계에 있다.
    lock-at-most-for: 50s
    lock-at-least-for: 10s
    # 발급된 지 이 시간이 지나지 않은 Redis 기록은 아직 저장 중일 수 있어 보정하지 않는다.
    grace-ms: 30000

logging:
  pattern:
    # 로그 줄마다 요청 ID (RequestIdFilter가 MDC에 넣는다). Traefik 접근 로그와 같은 값
    correlation: "[%X{requestId:-}] "
  level:
    # 락을 못 잡아 건너뛴 기록("Not executing ... It's locked")을 남긴다.
    net.javacrumbs.shedlock: debug
