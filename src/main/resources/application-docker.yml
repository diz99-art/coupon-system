# 컨테이너(docker compose의 cluster 프로필)에서 실행할 때.
# 접속 주소(DB_HOST=mysql, REDIS_HOST=redis, KAFKA_BOOTSTRAP_SERVERS=kafka:29092)와 비밀번호는 docker-compose.yml이 환경변수로 넣는다.
spring:
  jpa:
    hibernate:
      # 서버 두 대가 같은 DB를 쓰므로 켤 때마다 지우지(create) 않고 없는 테이블만 만든다.
      ddl-auto: update

server:
  # 연결을 많이 받도록 늘린다. 처리 스레드(200개)가 바쁘면 나머지는 줄을 서서 기다린다.
  tomcat:
    max-connections: 20000
    accept-count: 10000
    # 바쁜 스레드 수 같은 Tomcat 지표를 내보낸다.
    mbeanregistry:
      enabled: true
  shutdown: graceful

# 지표·상태 확인 주소는 사용자 요청과 다른 포트(8081)로 연다. nginx는 8080만 넘기므로 밖에서는 보이지 않는다.
management:
  server:
    port: 8081

coupon:
  kafka:
    # 개발 서버(bootRun)와 메시지가 섞이지 않도록 토픽과 그룹을 따로 쓴다.
    topic: coupon-issue-cluster
    dead-letter-topic: coupon-issue-cluster.DLT
    group-id: coupon-issue-saver-cluster
